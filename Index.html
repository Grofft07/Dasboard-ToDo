<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To Do List Kerja</title>
<style>
  :root{
    --ink:#12201c;
    --sub:rgba(255,255,255,.72);
    --sub-dark:#5b6b64;
    --line:rgba(255,255,255,.16);
    --glass:rgba(14,28,22,.52);
    --glass-2:rgba(14,28,22,.68);
    --card:rgba(255,255,255,.94);
    --accent:#2f9e6b;
    --accent-2:#1f7a53;
    --amber:#f0a93c;
    --red:#e05a4e;
    --blue:#3f7fd6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    color:#fff;
    min-height:100vh;
    background-color:#0b1712;
    background-size:cover;
    background-position:center 35%;
    background-attachment:fixed;
    background-repeat:no-repeat;
  }
  .topbar{
    background:var(--glass);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .topbar h1{
    font-size:16px;
    margin:0 24px 0 0;
    font-weight:700;
    letter-spacing:.2px;
    display:flex;align-items:center;gap:8px;
    text-shadow:0 1px 6px rgba(0,0,0,.4);
  }
  .topbar .controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .tabs{display:flex;gap:6px;}
  .tab-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    padding:7px 14px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
    font-weight:600;
  }
  .tab-btn:hover{background:rgba(255,255,255,.16);}
  .tab-btn.active{background:#fff;color:var(--accent-2);border-color:#fff;}
  .btn{
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .btn:hover{background:var(--accent-2);}
  .btn.secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);}
  .btn.secondary:hover{background:rgba(255,255,255,.2);}
  .btn.danger{background:var(--red);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:#fff;}

  .wrap{padding:18px 22px 48px;max-width:1400px;margin:0 auto;}

  .conn-banner{
    display:flex;align-items:center;gap:10px;
    background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:var(--sub);
  }
  .conn-banner .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .conn-banner.ok .dot{background:#5fe0a0;}
  .conn-banner.warn .dot{background:var(--amber);}
  .conn-banner a{color:#bfe3ff;text-decoration:none;font-weight:700;}

  .stats-row{
    display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px;
  }
  .stat-card{
    background:var(--glass-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  }
  .stat-card .lbl{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;}
  .stat-card .num{font-size:26px;font-weight:800;margin-top:4px;}
  .stat-card.overdue .num{color:#ff9a8c;}

  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
    background:var(--glass-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  }
  .toolbar select, .toolbar input[type="text"]{
    background:rgba(255,255,255,.92);color:var(--ink);border:none;border-radius:7px;
    padding:8px 10px;font-size:12.5px;min-width:120px;
  }
  .toolbar .spacer{flex:1;}

  .board{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  }
  .col{
    background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:16px;padding:14px;min-height:180px;
    max-height:74vh;display:flex;flex-direction:column;
  }
  .col-head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
    flex-shrink:0;
  }
  .col-scroll{
    overflow-y:auto;flex:1;margin:0 -6px;padding:0 6px;
  }
  .col-scroll::-webkit-scrollbar{width:7px;}
  .col-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:6px;}
  .col-scroll::-webkit-scrollbar-track{background:transparent;}
  .col-head .title{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .col-head .count{
    background:rgba(255,255,255,.16);border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;
  }
  .col[data-status="Belum"] .dotstatus{background:var(--amber);}
  .col[data-status="Proses"] .dotstatus{background:var(--blue);}
  .col[data-status="Selesai"] .dotstatus{background:var(--accent);}
  .dotstatus{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .task-card{
    background:var(--card);color:var(--ink);border-radius:12px;padding:12px 13px;margin-bottom:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.18);border-left:4px solid var(--accent);
  }
  .task-card.prio-Tinggi{border-left-color:var(--red);}
  .task-card.prio-Sedang{border-left-color:var(--amber);}
  .task-card.prio-Rendah{border-left-color:var(--blue);}
  .task-card.is-overdue{outline:1.5px solid var(--red);}
  .task-card .top-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .task-card .task-title{font-size:13.5px;font-weight:700;line-height:1.4;}
  .task-card .task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{
    font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;
  }
  .chip.kategori{background:#eaf5f0;color:var(--accent-2);}
  .chip.deadline{background:#fdeceb;color:#b23a30;}
  .chip.deadline.ok{background:#eef3fb;color:#2f5fa8;}
  .task-card .note{font-size:11.5px;color:var(--sub-dark);margin-top:8px;line-height:1.5;white-space:pre-wrap;}
  .task-card .actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end;}
  .icon-btn{
    border:none;background:#f1f3f5;color:var(--ink);border-radius:6px;padding:5px 8px;font-size:11.5px;cursor:pointer;font-weight:600;
  }
  .icon-btn:hover{background:#e5e8eb;}
  .icon-btn.move{background:#eaf5f0;color:var(--accent-2);}
  .icon-btn.del{background:#fdeceb;color:#c0342b;}
  .empty-col{color:var(--sub);font-size:12px;text-align:center;padding:20px 6px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,12,10,.55);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    background:#fff;color:var(--ink);border-radius:16px;padding:22px 24px;width:100%;max-width:480px;
    max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .modal h3{margin:0 0 14px;font-size:16px;}
  .form-row{margin-bottom:13px;}
  .form-row label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--ink);}
  .form-row input, .form-row select, .form-row textarea{
    width:100%;padding:9px 10px;border:1px solid #e1e5ea;border-radius:8px;
    font-size:13px;color:var(--ink);background:#fbfcfe;font-family:inherit;
  }
  .form-row textarea{resize:vertical;min-height:60px;}
  .modal .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--sub-dark);}
  .modal{position:relative;}

  .card{
    background:var(--glass-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;
  }
  .card.light{background:var(--card);color:var(--ink);}
  .section-title{font-size:14px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px;}

  .settings-grid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start;}
  @media (max-width:900px){.settings-grid{grid-template-columns:1fr;}}
  .hint{font-size:11.5px;color:var(--sub);margin-top:5px;}
  .card.light .hint{color:var(--sub-dark);}

  .guide-step{display:flex;gap:12px;margin-bottom:20px;}
  .guide-step .num{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent-2);
    color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .guide-step .body h4{margin:2px 0 6px;font-size:13.5px;}
  .guide-step .body p{margin:0 0 8px;font-size:12.5px;color:var(--sub-dark);line-height:1.55;}

  .code-block{
    position:relative;background:#0f1b2d;color:#d7e3f4;border-radius:8px;
    padding:14px 16px;font-family:Consolas,'Courier New',monospace;font-size:11.5px;
    line-height:1.55;overflow-x:auto;white-space:pre;margin:8px 0 4px;max-height:340px;
  }
  .copy-btn{
    position:absolute;top:8px;right:8px;background:rgba(255,255,255,.12);color:#fff;
    border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 9px;
    font-size:11px;cursor:pointer;
  }
  .copy-btn:hover{background:rgba(255,255,255,.22);}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
  .badge.ok{background:#e6f6ea;color:var(--accent-2);}
  .badge.warn{background:#fdeceb;color:var(--red);}
  .loading{padding:40px;text-align:center;color:var(--sub);font-size:13.5px;}

  .ticker{
    background:rgba(224,90,78,.22);
    border-bottom:1px solid rgba(255,255,255,.18);
    overflow:hidden;position:relative;z-index:19;
    display:flex;align-items:center;
  }
  .ticker.is-empty{display:none;}
  .ticker-label{
    flex-shrink:0;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;
    padding:7px 12px;letter-spacing:.3px;white-space:nowrap;
  }
  .ticker-track{
    flex:1;overflow:hidden;white-space:nowrap;position:relative;height:30px;
  }
  .ticker-track .ticker-content{
    display:inline-block;padding-left:100%;
    animation:ticker-scroll 28s linear infinite;
    line-height:30px;font-size:12.5px;font-weight:600;color:#fff;
  }
  .ticker-track .ticker-content span{margin-right:46px;}
  .ticker-track .ticker-content span.due-today{color:#ffd27a;}
  .ticker-track .ticker-content span.overdue{color:#ff9a8c;}
  @keyframes ticker-scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
  }
  .ticker-track:hover .ticker-content{animation-play-state:paused;}

  .bg-preview{
    width:100%;height:110px;border-radius:10px;background-size:cover;background-position:center;
    border:1px solid #e1e5ea;margin-bottom:12px;
  }
  .file-input-label{
    display:inline-block;background:#eef2f8;color:var(--ink);border:1px solid #e1e5ea;border-radius:8px;
    padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .file-input-label:hover{background:#e5eaf1;}
  input[type="file"]{display:none;}
  input[type="range"]{
    width:100%;accent-color:var(--accent-2);cursor:pointer;
  }
  .slider-row{display:flex;align-items:center;gap:10px;}
  .slider-row .slider-val{font-size:12px;font-weight:700;color:var(--sub-dark);min-width:34px;text-align:right;}

  @media (max-width:960px){
    .stats-row{grid-template-columns:repeat(2,1fr);}
    .board{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>🗒️ To Do List Kerja</h1>
  <div class="controls">
    <div class="tabs">
      <button class="tab-btn active" id="tabBoardBtn" onclick="switchTab('board')">📋 To Do</button>
      <button class="tab-btn" id="tabSettingsBtn" onclick="switchTab('settings')">⚙️ Pengaturan &amp; Panduan</button>
    </div>
    <button class="btn secondary" id="btnRefresh" onclick="refreshFromSheetBtn()" title="Tarik data terbaru dari Google Sheets">🔄 Refresh</button>
    <button class="btn" onclick="openTaskForm()">➕ Tambah Tugas</button>
  </div>
</div>

<div class="ticker is-empty" id="tickerBar">
  <div class="ticker-label">⏰ PENGINGAT</div>
  <div class="ticker-track"><div class="ticker-content" id="tickerContent"></div></div>
</div>

<div class="wrap">
  <div id="connBanner"></div>
  <div id="boardContent"><div class="loading">Memuat data…</div></div>
  <div id="settingsContent" style="display:none;"></div>
</div>

<div id="modalRoot"></div>

<script>
/* ======================================================================
   STATE & PENYIMPANAN LOKAL (localStorage)
   Dashboard ini file HTML biasa (bisa dibuka langsung di browser / hosting
   mana saja), terhubung ke Google Sheets lewat URL Web App Apps Script
   (deploy terpisah dari spreadsheet-nya sendiri) memakai fetch() — pola
   yang sama seperti Dashboard Marketing / Dashboard Advertiser.
   ====================================================================== */
const LOCAL_KEY = 'todoKerjaState_v1';
let appState = { appsScriptUrl:'', tasks:[], bgImage:'', overlayOpacity:0.78 };
let uiState = { filterKategori:'', filterPrioritas:'', search:'', editingId:null };

function saveLocalState(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(appState)); return true; }
  catch(e){ console.warn('Gagal menyimpan ke localStorage:', e); return false; }
}
function loadLocalState(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    appState.appsScriptUrl = parsed.appsScriptUrl || '';
    appState.tasks = Array.isArray(parsed.tasks) ? parsed.tasks : [];
    appState.bgImage = parsed.bgImage || '';
    appState.overlayOpacity = (typeof parsed.overlayOpacity === 'number') ? parsed.overlayOpacity : 0.78;
    return true;
  }catch(e){ console.warn('Gagal memuat localStorage:', e); return false; }
}
function getAppsScriptUrl(){ return (appState.appsScriptUrl || '').trim(); }

/* ======================================================================

   lewat tab Pengaturan. Gambar custom disimpan sebagai base64 di

function applyBackground(){
  const op = appState.overlayOpacity;
  const img = appState.bgImage || DEFAULT_BG;
  const s1 = (op*0.705).toFixed(2), s2 = (op*0.449).toFixed(2), s3 = op.toFixed(2);
  document.body.style.backgroundImage =
    'linear-gradient(180deg, rgba(6,14,10,'+s1+') 0%, rgba(6,14,10,'+s2+') 35%, rgba(6,12,10,'+s3+') 100%), url(\''+img+'\')';
}

function handleBgUpload(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 1600;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      appState.bgImage = dataUrl;
      const ok = saveLocalState();
      applyBackground();
      renderSettings();
      const statusEl = document.getElementById('bgSaveStatus');
      if (statusEl){
        statusEl.innerHTML = ok
          ? '<span class="badge ok">Background diganti ✓</span>'
          : '<span class="badge warn">Gambar terlalu besar untuk disimpan di browser ini — coba gambar dengan resolusi lebih kecil.</span>';
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function resetBgToDefault(){
  appState.bgImage = '';
  saveLocalState();
  applyBackground();
  renderSettings();
}

function updateOverlayOpacity(val){
  appState.overlayOpacity = parseFloat(val);
  applyBackground();
  const label = document.getElementById('overlayValLabel');
  if (label) label.textContent = Math.round(appState.overlayOpacity*100) + '%';
}
function commitOverlayOpacity(){
  saveLocalState();
}

const KATEGORI_LIST = ['Marketplace','Content Creator','SMS/CRM','Editorial','Meta Ads','Lainnya'];
const STATUS_LIST = ['Belum','Proses','Selesai'];
const PRIORITAS_LIST = ['Tinggi','Sedang','Rendah'];

/* ======================================================================
   KODE APPS SCRIPT (Code.gs) — user tempel di proyek Apps Script yang
   di-bind ke spreadsheet mereka sendiri, lalu deploy sebagai Web App.
   Sheet "ToDo" dibuat otomatis kalau belum ada.
   ====================================================================== */
const APPS_SCRIPT_CODE = `// ============================================================
// APPS SCRIPT — TO DO LIST KERJA
// Paste di Google Apps Script (Extensions -> Apps Script dari spreadsheet
// kamu) -> Deploy -> New deployment -> Web app
//   Execute as   : Me
//   Who has access: Anyone
// Salin URL hasil deploy ke kolom "URL Web App Apps Script" di dashboard.
// ============================================================

var SHEET_NAME = 'ToDo';
var HEADERS = ['ID','TanggalDibuat','Kategori','Prioritas','Tugas','Deadline','Status','Catatan'];

function getSheet_(){
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(SHEET_NAME);
  if (!sh){
    sh = ss.insertSheet(SHEET_NAME);
    sh.appendRow(HEADERS);
    sh.setFrozenRows(1);
  }
  return sh;
}

function doGet(e){
  var sh = getSheet_();
  return jsonOutput({ tasks: sheetToObjects_(sh) });
}

function doPost(e){
  var data = JSON.parse(e.postData.contents);
  var sh = getSheet_();
  var lock = LockService.getScriptLock();
  try{
    lock.waitLock(30000);
  } catch(lockErr){
    return jsonOutput({ status:'error', message:'Server sibuk, coba lagi.' });
  }
  try{
    if (data.type === 'upsert') upsertTask_(sh, data);
    else if (data.type === 'delete') deleteTask_(sh, data);
  } finally {
    lock.releaseLock();
  }
  return jsonOutput({ status:'ok' });
}

function jsonOutput(obj){
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function formatCellDate_(v){
  if (Object.prototype.toString.call(v) === '[object Date]'){
    return Utilities.formatDate(v, SpreadsheetApp.getActiveSpreadsheet().getSpreadsheetTimeZone(), 'yyyy-MM-dd');
  }
  return String(v || '').trim();
}

function sheetToObjects_(sheet){
  var rows = sheet.getDataRange().getValues();
  if (rows.length < 2) return [];
  var headers = rows[0].map(function(h){ return String(h).trim().toLowerCase(); });
  var out = [];
  for (var i = 1; i < rows.length; i++){
    var row = rows[i];
    var isEmpty = row.every(function(c){ return c === '' || c === null; });
    if (isEmpty) continue;
    var obj = {};
    headers.forEach(function(h, idx){
      var v = row[idx];
      obj[h] = (h === 'deadline' || h === 'tanggaldibuat') ? formatCellDate_(v) : v;
    });
    out.push(obj);
  }
  return out;
}

// Upsert berdasarkan ID (baris baru kalau ID belum ada, update kalau sudah ada)
function upsertTask_(sh, data){
  var rows = sh.getDataRange().getValues();
  var id = String(data.id).trim();
  var rowValues = [data.id, data.tanggaldibuat, data.kategori, data.prioritas, data.tugas, data.deadline, data.status, data.catatan];
  for (var i = 1; i < rows.length; i++){
    if (String(rows[i][0]).trim() === id){
      sh.getRange(i + 1, 1, 1, HEADERS.length).setValues([rowValues]);
      return;
    }
  }
  sh.appendRow(rowValues);
}

function deleteTask_(sh, data){
  var rows = sh.getDataRange().getValues();
  var id = String(data.id).trim();
  for (var i = 1; i < rows.length; i++){
    if (String(rows[i][0]).trim() === id){
      sh.deleteRow(i + 1);
      return;
    }
  }
}`;

/* ======================================================================
   SINKRONISASI: TARIK DATA (GET ?action=read) & KIRIM DATA (POST)
   ====================================================================== */
async function pullFromSheet(){
  const url = getAppsScriptUrl();
  if (!url) return 'no-url';
  try{
    const controller = new AbortController();
    const timer = setTimeout(function(){ controller.abort(); }, 20000);
    const res = await fetch(url + '?action=read', { cache:'no-store', signal: controller.signal });
    clearTimeout(timer);
    const json = await res.json();
    appState.tasks = (json.tasks || []).map(function(r){
      return {
        id: String(r.id || '').trim(),
        tanggalDibuat: String(r.tanggaldibuat || '').trim(),
        kategori: String(r.kategori || '').trim(),
        prioritas: String(r.prioritas || '').trim() || 'Sedang',
        tugas: String(r.tugas || '').trim(),
        deadline: String(r.deadline || '').trim(),
        status: String(r.status || '').trim() || 'Belum',
        catatan: String(r.catatan || '').trim()
      };
    }).filter(function(r){ return r.id && r.tugas; });
    saveLocalState();
    return 'ok';
  }catch(err){
    console.warn('Gagal menarik data dari spreadsheet:', err);
    return 'error';
  }
}

async function pushToSheet(payload){
  const url = getAppsScriptUrl();
  if (!url) return 'no-url';
  try{
    const controller = new AbortController();
    const timer = setTimeout(function(){ controller.abort(); }, 15000);
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timer);
    const body = await res.json().catch(function(){ return null; });
    if (body && body.status === 'error') return 'error';
    return 'ok';
  }catch(err){
    console.warn('Gagal mengirim data ke spreadsheet:', err);
    return 'error';
  }
}

async function refreshFromSheetBtn(){
  const btn = document.getElementById('btnRefresh');
  const url = getAppsScriptUrl();
  if (!url){
    switchTab('settings');
    return;
  }
  btn.disabled = true; btn.textContent = '⏳ Menarik…';
  const res = await pullFromSheet();
  btn.disabled = false; btn.textContent = '🔄 Refresh';
  renderConnBanner(res === 'ok' ? 'ok' : 'warn');
  renderBoard();
}

function renderConnBanner(state){
  const el = document.getElementById('connBanner');
  const url = getAppsScriptUrl();
  if (!url){
    el.innerHTML = '<div class="conn-banner warn"><span class="dot"></span> URL Apps Script belum diisi — data hanya tersimpan di perangkat/browser ini. Isi di tab <b>⚙️ Pengaturan &amp; Panduan</b> supaya tersinkron ke Google Sheets.</div>';
    return;
  }
  if (state === 'ok'){
    el.innerHTML = '<div class="conn-banner ok"><span class="dot"></span> Terhubung ke Google Sheets — setiap tugas baru / perubahan status otomatis dikirim ke sheet "ToDo".</div>';
  } else {
    el.innerHTML = '<div class="conn-banner warn"><span class="dot"></span> Tersimpan lokal, tapi gagal sinkron ke spreadsheet. Cek koneksi / URL Apps Script di tab Pengaturan.</div>';
  }
}

/* ======================================================================
   RENDER: BOARD (KANBAN)
   ====================================================================== */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function filteredTasks(){
  return appState.tasks.filter(function(t){
    if (uiState.filterKategori && t.kategori !== uiState.filterKategori) return false;
    if (uiState.filterPrioritas && t.prioritas !== uiState.filterPrioritas) return false;
    if (uiState.search && t.tugas.toLowerCase().indexOf(uiState.search.toLowerCase()) === -1) return false;
    return true;
  });
}

function renderStats(){
  const tasks = appState.tasks;
  const total = tasks.length;
  const selesai = tasks.filter(function(t){return t.status==='Selesai';}).length;
  const proses = tasks.filter(function(t){return t.status==='Proses';}).length;
  const belum = tasks.filter(function(t){return t.status==='Belum';}).length;
  const today = todayStr();
  const overdue = tasks.filter(function(t){return t.deadline && t.deadline < today && t.status !== 'Selesai';}).length;
  return `
    <div class="stats-row">
      <div class="stat-card"><div class="lbl">Total Tugas</div><div class="num">${total}</div></div>
      <div class="stat-card"><div class="lbl">Belum</div><div class="num">${belum}</div></div>
      <div class="stat-card"><div class="lbl">Proses</div><div class="num">${proses}</div></div>
      <div class="stat-card"><div class="lbl">Selesai</div><div class="num">${selesai}</div></div>
      <div class="stat-card overdue"><div class="lbl">Terlambat</div><div class="num">${overdue}</div></div>
    </div>
  `;
}

function renderToolbar(){
  const katOpts = ['<option value="">Semua Kategori</option>'].concat(KATEGORI_LIST.map(function(k){
    return `<option value="${k}" ${uiState.filterKategori===k?'selected':''}>${k}</option>`;
  })).join('');
  const prioOpts = ['<option value="">Semua Prioritas</option>'].concat(PRIORITAS_LIST.map(function(p){
    return `<option value="${p}" ${uiState.filterPrioritas===p?'selected':''}>${p}</option>`;
  })).join('');
  return `
    <div class="toolbar">
      <select onchange="uiState.filterKategori=this.value; renderBoard();">${katOpts}</select>
      <select onchange="uiState.filterPrioritas=this.value; renderBoard();">${prioOpts}</select>
      <input type="text" placeholder="Cari tugas…" value="${uiState.search}" oninput="uiState.search=this.value; renderBoard();">
      <div class="spacer"></div>
    </div>
  `;
}

function taskCardHtml(t){
  const today = todayStr();
  const isOverdue = t.deadline && t.deadline < today && t.status !== 'Selesai';
  const deadlineChip = t.deadline
    ? `<span class="chip deadline ${isOverdue?'':'ok'}">📅 ${t.deadline}${isOverdue?' · terlambat':''}</span>`
    : '';
  const moves = STATUS_LIST.filter(function(s){ return s !== t.status; });
  const moveBtns = moves.map(function(s){
    return `<button class="icon-btn move" onclick="changeStatus('${t.id}','${s}')">${statusLabel(s)}</button>`;
  }).join('');
  return `
    <div class="task-card prio-${t.prioritas} ${isOverdue?'is-overdue':''}">
      <div class="top-row">
        <div class="task-title">${escapeHtml(t.tugas)}</div>
      </div>
      <div class="task-meta">
        <span class="chip kategori">${escapeHtml(t.kategori || 'Lainnya')}</span>
        <span class="chip" style="background:#f4f0ea;color:#8a5a1a;">⚡ ${t.prioritas}</span>
        ${deadlineChip}
      </div>
      ${t.catatan ? `<div class="note">${escapeHtml(t.catatan)}</div>` : ''}
      <div class="actions">
        ${moveBtns}
        <button class="icon-btn" onclick="openTaskForm('${t.id}')">✏️</button>
        <button class="icon-btn del" onclick="confirmDelete('${t.id}')">🗑️</button>
      </div>
    </div>
  `;
}

function statusLabel(s){
  if (s==='Belum') return '↩️ Belum';
  if (s==='Proses') return '▶️ Proses';
  if (s==='Selesai') return '✅ Selesai';
  return s;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderTicker(){
  const bar = document.getElementById('tickerBar');
  const content = document.getElementById('tickerContent');
  const today = todayStr();
  const soonLimit = new Date();
  soonLimit.setDate(soonLimit.getDate() + 3);
  const soonStr = soonLimit.getFullYear() + '-' + String(soonLimit.getMonth()+1).padStart(2,'0') + '-' + String(soonLimit.getDate()).padStart(2,'0');

  const relevant = appState.tasks.filter(function(t){
    return t.deadline && t.status !== 'Selesai' && t.deadline <= soonStr;
  }).sort(function(a,b){ return a.deadline.localeCompare(b.deadline); });

  if (!relevant.length){
    bar.classList.add('is-empty');
    content.innerHTML = '';
    return;
  }

  const items = relevant.map(function(t){
    const isOverdue = t.deadline < today;
    const isToday = t.deadline === today;
    const cls = isOverdue ? 'overdue' : (isToday ? 'due-today' : '');
    const label = isOverdue ? 'TERLAMBAT' : (isToday ? 'DEADLINE HARI INI' : 'segera, ' + t.deadline);
    return `<span class="${cls}">⚠️ ${label} — ${escapeHtml(t.tugas)} (${escapeHtml(t.kategori||'Lainnya')})</span>`;
  });
  // digandakan supaya loop-nya terlihat menyambung
  content.innerHTML = items.join('') + items.join('');
  bar.classList.remove('is-empty');
}

function renderBoard(){
  renderConnBanner(getAppsScriptUrl() ? 'ok' : 'warn');
  const el = document.getElementById('boardContent');
  const tasks = filteredTasks();
  const cols = STATUS_LIST.map(function(status){
    const items = tasks.filter(function(t){ return t.status === status; });
    const cardsHtml = items.length
      ? items.map(taskCardHtml).join('')
      : '<div class="empty-col">Belum ada tugas di sini</div>';
    return `
      <div class="col" data-status="${status}">
        <div class="col-head">
          <div class="title"><span class="dotstatus"></span> ${statusColTitle(status)}</div>
          <div class="count">${items.length}</div>
        </div>
        <div class="col-scroll">${cardsHtml}</div>
      </div>
    `;
  }).join('');

  el.innerHTML = renderStats() + renderToolbar() + `<div class="board">${cols}</div>`;
  renderTicker();
}

function statusColTitle(s){
  if (s==='Belum') return 'Belum Dikerjakan';
  if (s==='Proses') return 'Sedang Proses';
  if (s==='Selesai') return 'Selesai';
  return s;
}

/* ======================================================================
   CRUD
   ====================================================================== */
function genId(){ return 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

function openTaskForm(id){
  uiState.editingId = id || null;
  const editing = id ? appState.tasks.find(function(t){return t.id===id;}) : null;
  const katOpts = KATEGORI_LIST.map(function(k){
    return `<option value="${k}" ${editing && editing.kategori===k?'selected':''}>${k}</option>`;
  }).join('');
  const prioOpts = PRIORITAS_LIST.map(function(p){
    return `<option value="${p}" ${editing && editing.prioritas===p?'selected':''}>${p}</option>`;
  }).join('');
  const statusOpts = STATUS_LIST.map(function(s){
    return `<option value="${s}" ${editing && editing.status===s?'selected':''}>${statusColTitle(s)}</option>`;
  }).join('');

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
      <div class="modal">
        <button class="close-x" onclick="closeModal()">✕</button>
        <h3>${editing ? '✏️ Edit Tugas' : '➕ Tambah Tugas'}</h3>
        <div class="form-row">
          <label>Nama Tugas *</label>
          <input type="text" id="fTugas" value="${editing ? escapeHtml(editing.tugas) : ''}" placeholder="mis. Follow up konten kreator bulan ini">
        </div>
        <div class="form-row">
          <label>Kategori</label>
          <select id="fKategori">${katOpts}</select>
        </div>
        <div class="form-row">
          <label>Prioritas</label>
          <select id="fPrioritas">${prioOpts}</select>
        </div>
        <div class="form-row">
          <label>Deadline</label>
          <input type="date" id="fDeadline" value="${editing ? editing.deadline : ''}">
        </div>
        <div class="form-row">
          <label>Status</label>
          <select id="fStatus">${statusOpts}</select>
        </div>
        <div class="form-row">
          <label>Catatan</label>
          <textarea id="fCatatan" placeholder="Detail tambahan (opsional)">${editing ? escapeHtml(editing.catatan) : ''}</textarea>
        </div>
        <div id="formStatus"></div>
        <div class="btn-row">
          <button class="btn secondary" onclick="closeModal()">Batal</button>
          <button class="btn" onclick="submitTaskForm()">${editing ? 'Simpan Perubahan' : 'Tambah Tugas'}</button>
        </div>
      </div>
    </div>
  `;
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  uiState.editingId = null;
}

async function submitTaskForm(){
  const tugas = document.getElementById('fTugas').value.trim();
  const kategori = document.getElementById('fKategori').value;
  const prioritas = document.getElementById('fPrioritas').value;
  const deadline = document.getElementById('fDeadline').value;
  const status = document.getElementById('fStatus').value;
  const catatan = document.getElementById('fCatatan').value.trim();
  const statusEl = document.getElementById('formStatus');

  if (!tugas){
    statusEl.innerHTML = '<span class="badge warn">Nama tugas wajib diisi</span>';
    return;
  }

  const editing = uiState.editingId;
  let task;
  if (editing){
    task = appState.tasks.find(function(t){return t.id===editing;});
    task.tugas = tugas; task.kategori = kategori; task.prioritas = prioritas;
    task.deadline = deadline; task.status = status; task.catatan = catatan;
  } else {
    task = {
      id: genId(), tanggalDibuat: todayStr(), kategori: kategori, prioritas: prioritas,
      tugas: tugas, deadline: deadline, status: status, catatan: catatan
    };
    appState.tasks.push(task);
  }
  saveLocalState();
  renderBoard();
  closeModal();

  const url = getAppsScriptUrl();
  if (!url) return;
  await pushToSheet({ type:'upsert', id:task.id, tanggaldibuat:task.tanggalDibuat, kategori:task.kategori, prioritas:task.prioritas, tugas:task.tugas, deadline:task.deadline, status:task.status, catatan:task.catatan });
}

async function changeStatus(id, newStatus){
  const task = appState.tasks.find(function(t){return t.id===id;});
  if (!task) return;
  task.status = newStatus;
  saveLocalState();
  renderBoard();
  const url = getAppsScriptUrl();
  if (!url) return;
  await pushToSheet({ type:'upsert', id:task.id, tanggaldibuat:task.tanggalDibuat, kategori:task.kategori, prioritas:task.prioritas, tugas:task.tugas, deadline:task.deadline, status:task.status, catatan:task.catatan });
}

function confirmDelete(id){
  const task = appState.tasks.find(function(t){return t.id===id;});
  if (!task) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
      <div class="modal" style="max-width:380px;">
        <h3>🗑️ Hapus Tugas?</h3>
        <p style="font-size:13px;color:var(--sub-dark);">"${escapeHtml(task.tugas)}" akan dihapus permanen dari daftar dan spreadsheet.</p>
        <div class="btn-row">
          <button class="btn secondary" onclick="closeModal()">Batal</button>
          <button class="btn danger" onclick="deleteTask('${id}')">Hapus</button>
        </div>
      </div>
    </div>
  `;
}

async function deleteTask(id){
  appState.tasks = appState.tasks.filter(function(t){return t.id!==id;});
  saveLocalState();
  closeModal();
  renderBoard();
  const url = getAppsScriptUrl();
  if (!url) return;
  await pushToSheet({ type:'delete', id:id });
}

/* ======================================================================
   TABS
   ====================================================================== */
function switchTab(tab){
  document.getElementById('boardContent').style.display = tab==='board' ? 'block' : 'none';
  document.getElementById('settingsContent').style.display = tab==='settings' ? 'block' : 'none';
  document.getElementById('tabBoardBtn').classList.toggle('active', tab==='board');
  document.getElementById('tabSettingsBtn').classList.toggle('active', tab==='settings');
  if (tab==='settings') renderSettings();
}

function copyCode(){
  navigator.clipboard.writeText(APPS_SCRIPT_CODE).then(function(){
    const btn = document.getElementById('copyCodeBtn');
    if (btn){ const old = btn.textContent; btn.textContent = '✓ Tersalin'; setTimeout(function(){btn.textContent = old;}, 1500); }
  });
}

async function saveUrlFromSettings(){
  const val = document.getElementById('urlInput').value.trim();
  appState.appsScriptUrl = val;
  saveLocalState();
  const statusEl = document.getElementById('urlSaveStatus');
  if (!val){
    statusEl.innerHTML = '<span class="badge warn">URL dikosongkan — dashboard hanya memakai penyimpanan lokal.</span>';
    renderConnBanner('warn');
    return;
  }
  statusEl.innerHTML = '<span style="color:var(--sub-dark);">Menghubungkan &amp; menarik data…</span>';
  const res = await pullFromSheet();
  statusEl.innerHTML = res === 'ok'
    ? '<span class="badge ok">Terhubung ✓ — data berhasil ditarik dari sheet "ToDo"</span>'
    : '<span class="badge warn">URL tersimpan, tapi gagal mengambil data. Cek deployment Apps Script kamu.</span>';
  renderBoard();
}

function renderSettings(){
  const url = getAppsScriptUrl();
  document.getElementById('settingsContent').innerHTML = `
    <div class="settings-grid">
      <div>
        <div class="card light">
          <div class="section-title">🔗 Koneksi Google Sheets</div>
          <div class="form-row">
            <label>URL Web App Apps Script</label>
            <input type="text" id="urlInput" value="${url}" placeholder="https://script.google.com/macros/s/…/exec">
            <div class="hint">Dapatkan URL ini dari langkah deploy di panduan sebelah kanan.</div>
          </div>
          <button class="btn" onclick="saveUrlFromSettings()">Simpan &amp; Hubungkan</button>
          <div id="urlSaveStatus" style="margin-top:10px;"></div>
        </div>
        <div class="card light">
          <div class="section-title">🖼️ Background Dashboard</div>
          <div class="bg-preview" style="background-image:url('${appState.bgImage || DEFAULT_BG}');"></div>
          <label class="file-input-label" for="bgFileInput">📤 Ganti Gambar</label>
          <input type="file" id="bgFileInput" accept="image/*" onchange="handleBgUpload(this)">
          ${appState.bgImage ? '<button class="btn ghost" style="margin-left:8px;color:var(--ink);border-color:#e1e5ea;" onclick="resetBgToDefault()">Kembalikan Default</button>' : ''}
          <div id="bgSaveStatus" style="margin-top:10px;"></div>
          <div class="form-row" style="margin-top:14px;">
            <label>Kegelapan Overlay</label>
            <div class="slider-row">
              <input type="range" min="0.2" max="0.95" step="0.05" value="${appState.overlayOpacity}" oninput="updateOverlayOpacity(this.value)" onchange="commitOverlayOpacity()">
              <span class="slider-val" id="overlayValLabel">${Math.round(appState.overlayOpacity*100)}%</span>
            </div>
            <div class="hint">Geser ke kanan supaya teks lebih kontras, ke kiri supaya gambar lebih terlihat.</div>
          </div>
        </div>
        <div class="card light">
          <div class="section-title">💾 Data Lokal</div>
          <p class="hint" style="margin:0 0 10px;">${appState.tasks.length} tugas tersimpan di perangkat ini.</p>
          <button class="btn secondary" onclick="clearLocalData()">Hapus Data Lokal</button>
        </div>
      </div>
      <div class="card light">
        <div class="section-title">📘 Panduan Setup (sekali saja)</div>
        <div class="guide-step">
          <div class="num">1</div>
          <div class="body">
            <h4>Buat Google Sheet baru</h4>
            <p>Boleh spreadsheet kosong — sheet "ToDo" dengan header akan dibuat otomatis oleh script di langkah berikutnya.</p>
          </div>
        </div>
        <div class="guide-step">
          <div class="num">2</div>
          <div class="body">
            <h4>Buka Apps Script</h4>
            <p>Di spreadsheet: menu <b>Extensions → Apps Script</b>. Hapus kode default, lalu tempel kode di bawah ini.</p>
            <div class="code-block" id="codeBlock">${escapeHtml(APPS_SCRIPT_CODE)}</div>
            <button class="copy-btn" id="copyCodeBtn" onclick="copyCode()">Salin Kode</button>
          </div>
        </div>
        <div class="guide-step">
          <div class="num">3</div>
          <div class="body">
            <h4>Deploy sebagai Web App</h4>
            <p>Klik <b>Deploy → New deployment</b> → pilih tipe <b>Web app</b>. Isi "Execute as: Me" dan "Who has access: Anyone". Klik Deploy, izinkan akses, lalu salin URL yang muncul.</p>
          </div>
        </div>
        <div class="guide-step">
          <div class="num">4</div>
          <div class="body">
            <h4>Tempel URL di sini</h4>
            <p>Paste URL hasil deploy ke kolom "URL Web App Apps Script" di sebelah kiri, lalu klik <b>Simpan &amp; Hubungkan</b>. Setelah itu semua tugas otomatis tersinkron dua arah.</p>
          </div>
        </div>
      </div>
    </div>
  `;
}

function clearLocalData(){
  if (!confirm('Yakin hapus semua data lokal di perangkat ini? (data di Google Sheets tidak ikut terhapus)')) return;
  appState.tasks = [];
  try{ localStorage.removeItem(LOCAL_KEY); }catch(e){}
  saveLocalState();
  renderBoard();
  renderSettings();
}

/* ======================================================================
   INIT
   ====================================================================== */
async function init(){
  loadLocalState();
  applyBackground();
  renderBoard();
  const url = getAppsScriptUrl();
  if (url){
    const res = await pullFromSheet();
    renderConnBanner(res === 'ok' ? 'ok' : 'warn');
    renderBoard();
  } else {
    renderConnBanner('warn');
  }
}
init();
</script>
